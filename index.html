<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Learn - 我的学习</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">
            <img src="assets/mascot.png" alt="logo">
            <span>C-Learn</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">我的</a></li>
            <li><a href="lesson.html">学习</a></li>
            <li><a href="practice.html">练习</a></li>
            <li><a href="error-book.html">错题本</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- 侧边栏 -->
        <aside>
            <div class="user-card">
                <img src="assets/mascot.png" class="avatar" alt="头像">
                <div class="username" id="username" title="点击修改昵称">新同学</div>
                <div class="user-desc">C语言学习之旅开启中</div>
                <div class="user-stats">
                    <div class="stat-item">
                        <div class="stat-num" id="studyDays">0</div>
                        <div class="stat-label">学习天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="finishedLesson">0</div>
                        <div class="stat-label">完成课程</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-num" id="rightRate">0%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main>
            <div class="content-card">
                <h2>学习进度</h2>
                <div class="progress-list">
                    <div class="progress-item">
                        <div class="progress-header">
                            <span>基础语法</span>
                            <span>0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="progress-item">
                        <div class="progress-header">
                            <span>流程控制</span>
                            <span>0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="progress-item">
                        <div class="progress-header">
                            <span>函数与数组</span>
                            <span>0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <h2>学习能力曲线</h2>
                <div class="chart-area" id="chartArea">
                    <!-- 初始为空，学习后自动生成 -->
                </div>
                <div style="display: flex; justify-content: space-around; font-size: 12px; color: #999;">
                    <span>第1天</span>
                    <span>第2天</span>
                    <span>第3天</span>
                    <span>第4天</span>
                    <span>第5天</span>
                    <span>第6天</span>
                    <span>第7天</span>
                </div>
                <p style="text-align: center; color: #bbb; font-size: 13px; margin-top: 16px;">
                    开始学习后，这里将生成你的能力成长曲线
                </p>
            </div>

            <div class="content-card">
                <h2>推荐课程</h2>
                <div class="lesson-list">
                    <div class="lesson-card" onclick="location.href='lesson.html'">
                        <div class="lesson-title">第一章：C语言入门</div>
                        <div class="lesson-desc">认识C语言、程序结构与第一个程序</div>
                        <span class="lesson-tag">入门</span>
                    </div>
                    <div class="lesson-card">
                        <div class="lesson-title">第二章：变量与数据类型</div>
                        <div class="lesson-desc">整型、浮点型、字符型与变量定义</div>
                        <span class="lesson-tag">基础</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <img src="assets/mascot.png" class="cat-decor" alt="装饰">

    <script src="js/app.js"></script>
</body>
</html>
