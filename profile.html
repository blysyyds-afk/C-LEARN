<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 · 学习报告</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <img src="assets/mascot.png" alt="布偶猫吉祥物" class="brand-logo" />
      <span class="brand-name">C-Learn</span>
    </div>
    <nav>
      <a href="index.html">工作台</a>
      <a href="course.html">课程</a>
      <a href="practice.html">练习</a>
      <a href="wrong-book.html">错题本</a>
      <a href="review.html">复习</a>
      <a href="profile.html" class="active">我的</a>
    </nav>
  </header>

  <main class="profile-page">
    <section class="profile-header">
      <img src="assets/mascot.png" alt="布偶猫头像" class="avatar" />
      <h1>自学者</h1>
      <p>当前阶段：入门到独立完成程序</p>
    </section>

    <section class="profile-stats">
      <div class="stat-card">
        <h3>连续学习</h3>
        <p class="stat-number" id="profile-continuous">0</p>
        <p class="stat-label">天</p>
      </div>
      <div class="stat-card">
        <h3>总学习时长</h3>
        <p class="stat-number" id="profile-minutes">0</p>
        <p class="stat-label">分钟</p>
      </div>
      <div class="stat-card">
        <h3>已完成题目</h3>
        <p class="stat-number" id="profile-questions">0</p>
        <p class="stat-label">道</p>
      </div>
      <div class="stat-card">
        <h3>错题二次正确率</h3>
        <p class="stat-number" id="profile-retry">0%</p>
        <p class="stat-label">复习表现</p>
      </div>
    </section>

    <section class="ability-section">
      <h2>能力曲线</h2>
      <div class="ability-bars">
        <div class="ability-item">
          <span>程序结构</span>
          <div class="bar"><div class="bar-fill" style="width: 60%"></div></div>
        </div>
        <div class="ability-item">
          <span>输出语句</span>
          <div class="bar"><div class="bar-fill" style="width: 70%"></div></div>
        </div>
        <div class="ability-item">
          <span>错误识别</span>
          <div class="bar"><div class="bar-fill" style="width: 40%"></div></div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
