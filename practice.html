<!DOCTYPE html>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="assets/mascot.png" alt="logo">
            <span>C-Learn</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">我的</a></li>
            <li><a href="lesson.html">学习</a></li>
            <li><a href="practice.html" class="active">练习</a></li>
            <li><a href="error-book.html">错题本</a></li>
        </ul>
    </nav>

    <div class="container">
        <div style="grid-column: 1 / -1;">
            <div class="content-card">
                <h2>章节练习</h2>
                <div class="lesson-list">
                    <div class="lesson-card">
                        <div class="lesson-title">入门语法专项</div>
                        <div class="lesson-desc">10道选择题，巩固基础概念</div>

                    </div>
                    <div class="lesson-card">
                        <div class="lesson-title">数据类型运算</div>
                        <div class="lesson-desc">15道题，覆盖整型、浮点型运算</div>
                        <span class="lesson-tag">难度：简单</span>
                    </div>
                    <div class="lesson-card">
                        <div class="lesson-title">if分支训练</div>
                        <div class="lesson-desc">12道题，掌握条件判断逻辑</div>
                        <span class="lesson-tag">难度：中等</span>
                    </div>
                    <div class="lesson-card">
                        <div class="lesson-title">循环结构进阶</div>
                        <div class="lesson-desc">for、while循环嵌套练习</div>
                        <span class="lesson-tag">难度：中等</span>
                    </div>
                </div>
            </div>
        </div>
